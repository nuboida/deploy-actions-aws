name: Deploy

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              env:
                AWS_REGION: ${{ secrets.AWS_REGION }}
                AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT }}
                AWS_ROLEID: ${{ secrets.AWS_ROLEID }}
              with:
                aws-region: ${{ env.AWS_REGION }}
                role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/${{ env.AWS_ROLEID }}
                role-session-name: AWSGithubdeploy

            # - name: Generate Ansible inventory
            #   run: |
            #     printf 'plugin: amazon.aws.aws_ec2\nregions:\n  - us-east-2\n  - us-west-1\nkeyed_group:\n  - key: tags.Ansible\nleading_separator: \"\"' > $RUNNER_TEMP/aws_ec2.yaml
            
            - name: Install Ansible
              run: |
                sudo apt update
                sudo apt install -y ansible python3-boto3
                ansible-galaxy collection install amazon.aws

            - name: Run Ansible playbook
              run: ansible-playbook -i "ansible/aws_ec2.yaml" ansible/test_aws_config.yaml
                