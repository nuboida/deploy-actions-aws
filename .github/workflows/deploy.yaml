name: Deploy

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Setup Node.js
              run: npm install

            - name: Install dependencies
              run: npm install

            - name: Run Test
              run: npm test

            - name: Build application
              run: npm run build

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              env:
                AWS_REGION: ${{ secrets.AWS_REGION }}
                AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT }}
                AWS_ROLEID: ${{ secrets.AWS_ROLEID }}
              with:
                aws-region: ${{ env.AWS_REGION }}
                role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/${{ env.AWS_ROLEID }}
                role-session-name: AWSGithubdeploy

            - name: Generate temp ssh key
              env:
                host_ip: ${{ secrets.HOST_IP }}
              run: |
                mkdir -p ~/.ssh
                ssh-keygen -t ed25519 -f /home/runner/.ssh/ed25519 -N ''
                ssh-keyscan ${{ env.host_ip }} >> /home/runner/.ssh/known_hosts
            
            - name: Install Ansible
              run: |
                sudo apt update
                sudo apt install -y ansible python3-boto3
                pipx inject ansible-core boto3 botocore
                ansible-galaxy collection install amazon.aws

            - name: Run Ansible playbook
              env:
                AWS_REGION: ${{ secrets.AWS_REGION }}
                EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
              run: ansible-playbook ansible/site.yaml
                